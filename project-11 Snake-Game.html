<!DOCTYPE html>
<html>
	<head>
	<title>snake Game</title>
		<style>
			*{
				padding: 0;
				margin: 0;
				box-sizing: border-box;
				font-family: arial;
			}
	
			html,
			body{
				width: 100%;
				height: 100%;
			}
	
			body{
				width: 100vw;
				height: 100vh;
				background-color: #24313c;
				display: flex;
				justify-content: center;	
				align-items: center;
			}
	
			.board{
				width: 80vw;
				max-width: 500px;
				height: 500px;
				background-color: transparent;
				box-shadow: 2px 2px 10px #111, -2px -2px 10px #111, -2px -2px 10px #111, -2px -2px 10px #111;
				display: grid;
				grid-template-columns: repeat(14, 1fr);
				grid-template-rows: repeat(14, 1fr);
				padding: 10px;
			}
	
			.food{
				width: 100%;
				height: 100%;
				background-color: #ff9900;	
				border-radius: 50%;
			}
	
			.snake-head{
				background-color: royalblue;
				width: 100%;
				height: 100%;	
				border-radius: 50%;
			}
	
			#head0{
				background-color: #9c27b0;
				border-radius: 10px;
			}
		</style>
	</head>
	<body>
		<div class="board js-board"></div>

		<script>
			const board = document.querySelector(".js-board");
			const snakeBody = [];
			let foodX;
			let foodY;
			let snakeX = 3;
			let snakeY = 5;
			let velocityX = 0;
			let velocityY = 0;
			let intervalId;
			let gameOver = false;
			
			function main(){
	
				if(gameOver){
					return showGameOver();
				}

				if(foodX === snakeX && foodY === snakeY){
					foodPos();

					snakeBody.push([foodX, foodY]);
					console.log(snakeBody);
				}

				for(i = snakeBody.length - 1; i > 0; i--){
					snakeBody[i] = snakeBody[i-1];
				}

				snakeX += velocityX;
				snakeY += velocityY;
				snakeBody[0] = [snakeX, snakeY];
				let setHTML = `<div class="food" style="grid-area: ${foodY}/${foodX}"></div>`;

				for(i = 0; i < snakeBody.length; i++){
					setHTML += `<div class="snake-head" id="head${i}" style="grid-area: ${snakeBody[i][1]}/${snakeBody[i][0]}"></div>`;
					
					if(i != 0 && snakeBody[0][1] === snakeBody[i][1] && snakeBody[0][0] === snakeBody[i][0]){
						gameOver = true;
					}
				}
				
				if(snakeX <= 0 || snakeX > 14 || snakeY <= 0 || snakeY > 14){
					gameOver = true;
				}

				board.innerHTML = setHTML;
			}

			function foodPos(){
				foodX = Math.floor(Math.random() * 14) + 1;
				foodY = Math.floor(Math.random() * 14) + 1;
			}

			function moveSnake(e){
				if(e.key === "ArrowUp" && velocityY != 1){
					velocityX = 0;
					velocityY = -1;
				} else if(e.key === "ArrowDown" && velocityY != -1){
					velocityX = 0;
					velocityY = 1;
				} else if(e.key === "ArrowLeft" && velocityX != 1){
					velocityX = -1;
					velocityY = 0;
				} else if(e.key === "ArrowRight" && velocityX != -1){
					velocityX = 1;
					velocityY = 0;
				}

				main();
			}

			function showGameOver(){
				document.removeEventListener("keydown", moveSnake);
				clearInterval(intervalId);
			}

			document.addEventListener("keydown", moveSnake);
			
			foodPos();
			intervalId = setInterval(main, 250);
			main();
		</script>
	</body>
</html>
