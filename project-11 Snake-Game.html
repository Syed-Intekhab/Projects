<!DOCTYPE html>
<html>
	<head>
	<title>snake Game</title>
		<style>
			*{
				padding: 0;
				margin: 0;
				box-sizing: border-box;
				font-family: arial;
			}
	
			html,
			body{
				width: 100%;
				height: 100%;
			}
	
			body{
				width: 100vw;
				height: 100vh;
				background-color: #24313c;
				display: flex;
				justify-content: center;	
				align-items: center;
			}
	
			.board{
				width: 80vw;
				max-width: 500px;
				height: 500px;
				background-color: transparent;
				box-shadow: 2px 2px 10px #111, -2px -2px 10px #111, -2px -2px 10px #111, -2px -2px 10px #111;
				display: grid;
				grid-template-columns: repeat(14, 1fr);
				grid-template-rows: repeat(14, 1fr);
				padding: 10px;
			}
	
			.food{
				width: 100%;
				height: 100%;
				background-color: #ff9900;	
				border-radius: 50%;
			}
	
			.snake-head{
				background-color: royalblue;
				width: 100%;
				height: 100%;	
				border-radius: 50%;
			}
	
			#head0{
				background-color: #9c27b0;
				border-radius: 10px;
			}
		</style>
	</head>
	<body>
		<div class="board js-board"></div>
	</body>
</html>
