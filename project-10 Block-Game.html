<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Game</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: arial;
        }

        html,
        body{
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f7f7f7;
        }

        .game-board{
            width: 80vw;
            max-width: 500px;
            height: 500px;
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            grid-template-rows: repeat(14, 1fr);
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        .food{
            background-color: orangered;
            z-index: 1;
        }

        .snake-head{
            background-color: royalblue;
            z-index: 2;
        }

        .score{
            position: fixed;
            top: 1%;
            right: 1%;
            padding: 10px 20px;
            border-radius: 4px;
            background-color: #111111;
            color: #ffffff;
        }

        .time{
            position: fixed;
            top: 1%;
            left: 1%;
            padding: 10px 20px;
            border-radius: 4px;
            background-color: #111111;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="game-board js-game-board"></div>
    <div class="score js-score">Score: 0</div>
    <div class="time js-time">Time: 1</div>

    <script>
        const gameBoard = document.querySelector(".js-game-board");
        let score = 0;
        let remainingTime = 60;
        let foodX;
        let foodY;
        let snakeX = 1;
        let snakeY = 1;
        let foodHTML = "";

        function foodLocation(){
            foodX = Math.floor(Math.random() * 14) + 1;
            foodY = Math.floor(Math.random() * 14) + 1;
        }

        function main(){
            foodHTML = `<div class="snake-head" style="grid-area: ${snakeY}/${snakeX};"></div>`;
            foodHTML += `<div class="food" style="grid-area: ${foodY}/${foodX};"></div>`;

            if(foodX === snakeX && foodY === snakeY){
                foodLocation();
                score++;
            }
                
            document.querySelector(".js-score").innerHTML = `Score: ${score}`;;
            gameBoard.innerHTML = foodHTML;
        }

        document.addEventListener("keydown", (event) => {

            if(event.key === "ArrowUp"){
                snakeY -= 1;
            } else if(event.key === "ArrowDown"){
                snakeY += 1;
            } else if(event.key === "ArrowRight"){
                snakeX += 1;
            } else if(event.key === "ArrowLeft"){
                snakeX -= 1;
            }

            main();
        });
        
        foodLocation();
        main();
        
        
        const intervalId = setInterval(() => {
            remainingTime--;
            document.querySelector(".js-time").innerHTML = `Time: ${remainingTime}`;
        }, 1000);	
        
        setTimeout(() => {
            clearInterval(intervalId);
            alert(`Times up! your score is: ${score}`);
        }, 60000);
    </script>
</body>
</html>
