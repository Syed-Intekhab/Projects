<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Recipe App</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap');	
			@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Roboto+Slab:wght@100..900&display=swap');	

			*{
				padding: 0;	
				margin: 0;
				box-sizing: border-box;
  				font-family: "Roboto Slab", serif;
  				font-optical-sizing: auto;
  				font-weight: normal;
  				font-style: normal;
				scroll-behavior: smooth;
			}

			html,
			body{
				height: 100%;
				width: 100%;
				background-color: #f7f7f7;
			}

			.main-header-container{
				height: 60px;
				width: 100%;
				background-color: #111111;
				padding: 10px 20px;
			}

			.nav-container{
				height: 100%;
				width: 100%;
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 18px;
			}

			.nav-container a{
				text-decoration: none;
				color: #ffffff;
				letter-spacing: 0.5px;
				font-family: "Josefin Sans", sans-serif;
  				font-optical-sizing: auto;
			}

			/* Search Section styling */			
			.search-container{
				width: 100%;
				display: flex;
				align-items: center;
				justify-content: flex-start;
				flex-direction: column;
				gap: 20px;
			}

			.search-container > h1{
				text-align: center;
			}

			.search-container .input-container{
				width: 100%;
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 10px;
			}
			
			.search-container .input-container input{
				padding: 8px;
				font-size: 16px;
				border: 1px solid #ddd;
				border-radius: 3px;
				width: 80%;
				max-width: 400px;
			}
		
			.btn{
				background-color: #111;
				border-radius: 4px;
				font-size: 16px;
				padding: 7px 16px;
				color: #ffffff;
				cursor: pointer;
			}

			.search-container .input-container button:hover{
				opacity: 0.8;
			}
		
			/* Main Section Styling */
			.main-container{
				width: 100%;
				padding: 25px 30px;
			}
			
			.home-section{
				width: 100%;
			}

			.card-container{
				margin-top: 20px;
				display: flex;
				justify-content: center;
				align-items: flex-start;
				flex-wrap: wrap;
				gap: 20px;
			}

			.card{
				width: 300px;
				height: 350px;
				background-color: #ffffff;
				border-radius: 5px;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
				overflow: hidden;
				padding: 10px 20px;
				cursor: pointer;
			}

			.card-image{
				width: 100%;
				height: 180px;
				object-fit: cover;
				object-position: center;
				border-radius: 5px;
				margin-bottom: 15px;
			}

			.card-title{
				font-size: 25px;
				font-weight: 900;
				text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
				margin-bottom: 15px;
			}

			.card-description{
				font-size: 15px;
				font-weight: 100;
			}
		
			/* Add Recipe Section Styling */
			.add-recipe-section{
				width: 100%;
			}

			.form-container{
				width: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 20px;
			}

			.form-container>h1{
				text-align: center;
			}

			.form-container form{
				display: flex;
				flex-direction: column;
				width: 100%;
				background-color: #ffffff;
				border: 1px solid #ddd;
				border-radius: 20px;
				overflow: hidden;
				padding: 20px;
				gap: 5px;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
			}

			.form-container form label{
				font-size: 18px;
				font-weight: 700;
				letter-spacing: 0.4px;
			}

			.form-elems{
				margin-bottom: 15px;
				resize: none;
				padding: 8px;
				border-radius: 5px;
				border: 1px solid #ddd;
			}

			.form-container form select{
				padding: 5px;
				font-size: 15px;
				width: 100%;
				border-radius: 3px;
			}

			.form-container form button{
				background-color: #111111;
				padding: 10px 18px;
				border-radius: 5px;
				border: none;
				color: #ffffff;
				width: fit-content;
				margin-top: 10px;
				cursor: pointer;
			}	

			/* All recipes Section */
			.all-recipe-container h1{
				text-align: center;
			}
				
			/* Card Details Section styling */
			.card-details-section{
				width: 100%;
			}
	
			.card-details-container{
				padding: 10px 20px;
				background-color: #ffffff;
				border-radius: 10px;
				border: 1px solid #ddd;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
			}

			.card-details-container > h1{
				text-align: center;
				margin-top: 10px;
				margin-bottom: 25px;
			}

			.card-details-container > img{
				width: 50%;
			    	max-width: 400px;
			    	min-width: 170px;
				object-fit: cover;
				border-radius: 5px;
				object-position: center;
			}

			.card-details-container > h2{
				margin-top: 20px;
			}
	
			.card-details-container > p{
				margin-bottom: 20px;
				margin-top: 5px;
			}				

			/* Handle Hidden Sections */
			.hidden{
				display: none;
			}
		</style>
	</head>
	<body>
		<header class="main-header-container">
			<nav class="nav-container">
				<a href="#home" onclick="showSection('home')">Home</a>
				<a href="#add-recipe" onclick="showSection('add-recipe')">Add Recipe</a>
				<a href="#all-recipes" onclick="showSection('all-recipes')">All Recipes</a>
			</nav>
		</header>
		<main class="main-container">
			<section class="home-section section hidden" id="home">
				<div class="search-container">
					<h1>Welcome to QuickBites</h1>
					<div class="input-container">
						<input placeholder="Search Recipes" id="search-field">
						<button class="btn" onclick="
							//callAPI()
							// Uncomment above function call if you have an API key.
							alert('Sorry no API Key found!');
						">Search</button>
					</div>
				</div>

				<div class="card-container js-home-card-container">
					<!-- Generating HTML with JS -->
				</div>
			</section>

			<section class="add-recipe-section section hidden" id="add-recipe">
				<div class="form-container">
					<h1>Add a New Recipe</h1>
					<form class="recipe-form">
						<label for="title">Title</label>
						<input class="form-elems" type="text" placeholder="Recipe Title" id="title" required>

						<label for="desc">Description</label>
						<textarea class="form-elems" id="desc" placeholder="Description about the recipe..." rows="3" required></textarea>

						<label for="ingred">Ingredients</label>
						<textarea class="form-elems" id="ingred" rows="5" placeholder="Ingredients used in recipe..." required></textarea>

						<label for="steps">Steps</label>
						<textarea class="form-elems" id="steps" rows="8" placeholder="Steps to make the racipe..." required></textarea>

						<label for="img-url">Image URL</label>
						<input class="form-elems" type="text" placeholder="Enter image URL" id="img-url">

						<label for="category">Category</label>
						<select name="category" id="category" required>
							<option value="breakfast">Breakfast</option>
							<option value="lunch">Lunch</option>
							<option value="dinner">Dinner</option>
							<option value="dessertsd">Desserts</option>
						</select>

						<button type="submit">Add Recipe</button>
					</form>
				</div>
			</section>

			<section class="all-recipe-section section hidden" id="all-recipes">
				<div class="all-recipe-container">
					<h1>All Recipes</h1>
					<div class="card-container js-all-recipes">
						<!-- Generating HTML using JS -->
					</div>
				</div>
			</section>

			<section class="card-details-section section hidden" id="card-details">
				<div class="card-details-container js-card-details-container">
					<!-- Generating HTML with JS -->
				</div>
			</section>
		</main>

		<script>
			const recipes = JSON.parse(localStorage.getItem("recipes")) || [];
			const API_KEY = `Paste Your API key here!`;
			
			function showSection(sectionId){
				document.querySelectorAll(".section").forEach(section => {
					section.classList.add("hidden");
				});

				document.getElementById(sectionId).classList.remove("hidden");
			}

			function showCards(){
				let recipesHTML = "";

				recipes.slice(0, 3).forEach(recipe => {
					recipesHTML += `
						<div class="card">
							<img class="card-image" src="${recipe.img}" alt="${recipe.title}" onerror="this.onerror=null; this.src='assets/fallback-image.jpg';">
							<h2 class="card-title">${recipe.title}</h2>
							<p class="card-description">${recipe.desc}</p>
						</div>
					`;
				});

				document.querySelector(".js-home-card-container").innerHTML = recipesHTML;

				let allRecipesHTML = "";
				
				recipes.forEach(recipe => {
					allRecipesHTML += `
						<div class="card" onclick="handleCardInfo(dataset.recipeId)" data-recipe-id="${recipe.id}">
							<img class="card-image" src="${recipe.img}" alt="${recipe.title}" onerror="this.onerror=null; this.src='assets/fallback-image.jpg';">
							<h2 class="card-title">${recipe.title}</h2>
							<p class="card-description">${recipe.desc}</p>
						</div>
					`;
				});

				document.querySelector(".js-all-recipes").innerHTML = allRecipesHTML;
			}

			document.querySelector(".recipe-form").addEventListener("submit", (event) => {
				event.preventDefault();

				const title = document.getElementById("title").value;
				const desc = document.getElementById("desc").value;
				const ingred = document.getElementById("ingred").value;
				const steps = document.getElementById("steps").value;
				const img = document.getElementById("img-url").value;
				const category = document.getElementById("category").value;
				
				const newRecipe = {
					id: recipes.length + 1,
					title,
					desc,
					ingred,
					steps,
					img,
					category
				};

				recipes.unshift(newRecipe);
				addToStorage();
        		showSection('all-recipes');
				showCards();
				document.querySelector(".recipe-form").reset();
			});

			document.addEventListener('DOMContentLoaded', () => {
        			showSection('home');
					showCards();
        		});

			function handleCardInfo(recipeId){
				let matchingCard;
				
				recipes.forEach((recipe) => {
					if(recipeId == recipe.id){
						matchingCard = recipe;
					}
				});

				document.querySelector('.js-card-details-container').innerHTML = `
					<h1>${matchingCard.title}</h1>
					<img class="card-image" src="${matchingCard.img}" alt="${matchingCard.title}" onerror="this.onerror=null; this.src='assets/fallback-image.jpg';">
					<h2>Description</h2>
					<p>${matchingCard.desc.replace(/\n/g, '<br>')}</p>
					<h2>Ingredients</h2>
					<p>${matchingCard.ingred.replace(/\n/g, '<br>')}</p>
					<h2>Steps</h2>
					<p>${matchingCard.steps.replace(/\n/g, '<br>')}</p>
					<h2>Category</h2>
					<p>${matchingCard.category}</p>
					<button class="btn" onclick="showSection('all-recipes')">Back to Recipes</button>
				`;

				showSection('card-details');
			}
				
			function addToStorage(){
				localStorage.setItem("recipes", JSON.stringify(recipes));
			}

			function callAPI(){
				const query = document.getElementById("search-field").value;

				const URL = `https://api.spoonacular.com/recipes/complexSearch?query=${query}&apiKey=${API_KEY}`;
	
				fetch(URL).then((response) => {
					return response.json();
				}).then((response) => {
					let recipesHTML = "";

					response.results.forEach(recipe => {
						recipesHTML += `
							<div class="card">
								<img class="card-image" src="${recipe.image}" alt="${recipe.title}" onerror="this.onerror=null; this.src='assets/fallback-image.jpg';">
								<h2 class="card-title">${recipe.title}</h2>
							</div>
						`;
					});
	
					document.querySelector(".js-home-card-container").innerHTML = recipesHTML;
				});
			}
		</script>
	</body>
</html>
